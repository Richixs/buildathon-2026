services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: pollar_track
      POSTGRES_PASSWORD: pollar_track
      POSTGRES_DB: pollar_track
    ports:
      - "5432:5432"
    volumes:
      - dev_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pollar_track -d pollar_track"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dev_db_data:
