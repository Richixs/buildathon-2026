services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: pollar_track
      POSTGRES_PASSWORD: pollar_track
      POSTGRES_DB: pollar_track
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pollar_track -d pollar_track"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: dev
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://pollar_track:pollar_track@db:5432/pollar_track?schema=public
      NODE_ENV: development
      # Interpolated from the shell or ./.env — config/wagmi.ts throws at
      # boot without NEXT_PUBLIC_PROJECT_ID.
      NEXT_PUBLIC_PROJECT_ID: ${NEXT_PUBLIC_PROJECT_ID:?set NEXT_PUBLIC_PROJECT_ID in .env}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_ESCROW_CHAIN_ID: ${NEXT_PUBLIC_ESCROW_CHAIN_ID:-133}
      NEXT_PUBLIC_ESCROW_FACTORY_ADDRESS: ${NEXT_PUBLIC_ESCROW_FACTORY_ADDRESS:-}
      ESCROW_RPC_URL: ${ESCROW_RPC_URL:-}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
