name: Build & Deploy (prod)

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - prisma/**
      - prisma.config.ts
      - app/**
      - lib/**
      - next.config.ts
      - .github/workflows/ci-prod.yml

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  build-and-push:
    needs: lint
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-deploy-repo:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE_TAG: ghcr.io/${{ github.repository }}:${{ needs.build-and-push.outputs.image_tag }}
      DEPLOY_REPO_URL: ${{ vars.DEPLOY_REPO_URL || 'lab.sasxr.com/s-system/deploy.git' }}
    steps:
      - name: Clone deploy repo
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          git config --global http.sslVerify false
          git clone "https://oauth2:${DEPLOY_TOKEN}@${DEPLOY_REPO_URL}" deploy

      - name: Set prod overlay image with kustomize
        working-directory: deploy/k8s/apps/buildathon/overlays/prod
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.3.0/kustomize_v5.3.0_linux_amd64.tar.gz" | tar xz
          ./kustomize edit set image buildathon-app="${IMAGE_TAG}"
          rm -f kustomize

      - name: Commit and push
        working-directory: deploy
        run: |
          git config user.email "github-actions@sasxr.com"
          git config user.name "GitHub Actions"
          git add k8s/apps/buildathon/overlays/prod/kustomization.yaml
          git diff --cached --quiet || git commit -m "Update buildathon PROD image to ${GITHUB_SHA::7}"
          git push origin main
