name: Lint

on:
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          DATABASE_URL: "postgresql://pollar_track:pollar_track@localhost:5432/pollar_track?schema=public"
      - run: npm run lint
      - run: npm run format:check
